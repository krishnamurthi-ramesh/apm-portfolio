<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f33"/>
      <stop offset="100%" stop-color="#090e17"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d07f"/>
      <stop offset="50%" stop-color="#d4a34b"/>
      <stop offset="100%" stop-color="#a67c2e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5b869"/>
      <stop offset="100%" stop-color="#805d22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" filter="url(#shadow)"/>

  <!-- Subtle Inner Hairline Accent -->
  <rect x="13" y="13" width="102" height="102" rx="22" fill="none" stroke="#e5b869" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Elegant Serif Monogram 'K' -->
  <text x="64" y="90" font-family="'Cormorant Garamond', 'Playfair Display', 'Georgia', serif" font-size="82" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.6))">K</text>

  <!-- Subtle Corner Sparkle -->
  <circle cx="100" cy="28" r="2.5" fill="#f5d07f" opacity="0.85"/>
</svg>
